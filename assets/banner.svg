<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Shweta Smriti Tripathi, Data Engineer and Data Scientist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.55" stop-color="#0d1f33"/>
      <stop offset="1" stop-color="#12324a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#7cc8ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#38bdf8"/>
      <stop offset="0.8" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.4">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <path id="pipe" d="M60 278 C 260 278, 300 238, 470 238 S 700 288, 860 262 S 1060 214, 1150 226"/>
  </defs>

  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .tw{animation:tw 3.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .rise{animation:rise 1.1s ease-out both}
    .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .draw{stroke-dasharray:1400;animation:draw 3s ease-out both}
    @keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.6);opacity:.25}}
  </style>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow2)"/>

  <!-- twinkling data points -->
  <g fill="#bfe6ff">
    <circle class="tw" cx="120" cy="40" r="1.6"/>
    <circle class="tw" cx="330" cy="26" r="1.2" style="animation-delay:.6s"/>
    <circle class="tw" cx="560" cy="58" r="1.4" style="animation-delay:1.2s"/>
    <circle class="tw" cx="690" cy="22" r="1.1" style="animation-delay:.3s"/>
    <circle class="tw" cx="1120" cy="40" r="1.5" style="animation-delay:1.8s"/>
    <circle class="tw" cx="980" cy="300" r="1.2" style="animation-delay:.9s"/>
    <circle class="tw" cx="40" cy="190" r="1.3" style="animation-delay:2.2s"/>
    <circle class="tw" cx="620" cy="190" r="1" style="animation-delay:1.5s"/>
  </g>

  <!-- forecast chart drawing itself (right side) -->
  <g transform="translate(790 52)">
    <rect width="340" height="150" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#7cc8ff" stroke-opacity="0.18"/>
    <text x="18" y="28" class="mono" font-size="12" fill="#7cc8ff" fill-opacity="0.85">forecast.predict(next_year)</text>
    <g stroke="#ffffff" stroke-opacity="0.06">
      <line x1="18" y1="60" x2="322" y2="60"/><line x1="18" y1="92" x2="322" y2="92"/><line x1="18" y1="124" x2="322" y2="124"/>
    </g>
    <path class="draw" d="M18 112 C 40 70, 58 70, 76 104 S 112 130, 132 86 S 168 52, 188 96 S 222 128, 240 82" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>
    <path class="draw" d="M240 82 C 258 52, 276 58, 292 92 S 312 112, 322 80" fill="none" stroke="#f472b6" stroke-width="2.6" stroke-dasharray="6 6" stroke-linecap="round" style="animation-delay:1.6s"/>
    <circle class="pulse" cx="240" cy="82" r="5" fill="#a78bfa"/>
    <text x="250" y="136" class="t" font-size="11" fill="#f9a8d4">predicted</text>
    <text x="150" y="136" class="t" font-size="11" fill="#7dd3fc">actual</text>
  </g>

  <!-- name block -->
  <g class="t">
    <text x="60" y="78" font-size="15" letter-spacing="4" fill="#7cc8ff" class="rise">HELLO, I'M</text>
    <text x="58" y="136" font-size="54" font-weight="800" fill="url(#name)" class="rise d1">Shweta Smriti Tripathi</text>
    <text x="60" y="176" font-size="22" font-weight="500" fill="#dbeafe" class="rise d2">Data Engineer  ·  Data Scientist  ·  AI Agents</text>
    <g class="rise d3">
      <rect x="60" y="196" width="226" height="30" rx="15" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="173" y="216" font-size="13.5" text-anchor="middle" fill="#bae6fd">🎓 MS Data Science · Columbia</text>
      <rect x="298" y="196" width="250" height="30" rx="15" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="423" y="216" font-size="13.5" text-anchor="middle" fill="#ddd6fe">💼 Ex Amazon · Providence · Dell</text>
    </g>
  </g>

  <!-- data pipeline with flowing packets -->
  <use href="#pipe" fill="none" stroke="url(#line)" stroke-width="2.4" class="draw"/>
  <use href="#pipe" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="7" filter="url(#soft)"/>
  <g fill="#e0f2fe">
    <circle r="4"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="3" fill="#c4b5fd"><animateMotion dur="6s" begin="1.5s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="3.5" fill="#f9a8d4"><animateMotion dur="6s" begin="3s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="6s" begin="4.5s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
  </g>
  <g class="mono" font-size="12" fill="#93c5fd" fill-opacity="0.9">
    <circle cx="200" cy="270" r="5" fill="#38bdf8"/><text x="186" y="304">ingest</text>
    <circle cx="470" cy="238" r="5" fill="#60a5fa"/><text x="448" y="272">transform</text>
    <circle cx="760" cy="276" r="5" fill="#a78bfa"/><text x="744" y="308" fill="#c4b5fd">model</text>
    <circle cx="1040" cy="236" r="5" fill="#f472b6"/><text x="1018" y="270" fill="#f9a8d4">insight</text>
  </g>
</svg>
